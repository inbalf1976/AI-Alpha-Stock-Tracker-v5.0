name: Stop Hunt Check (research, read-only)

on:
  workflow_dispatch:
    inputs:
      hunt_max_pierce_cents:
        description: "Max cents beyond the stop that still counts as a hunt-like pierce"
        required: false
        default: "5"

permissions:
  contents: read

jobs:
  stop-hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Run stop-hunt analysis
        env:
          HUNT_MAX_PIERCE_CENTS: ${{ inputs.hunt_max_pierce_cents || '5' }}
        run: python stop_hunt_check.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stop-hunt-report
          path: stop_hunt_report.json
          if-no-files-found: ignore
