name: Run Backtest
on:
  workflow_dispatch:  # manual trigger only
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yfinance pandas numpy scikit-learn
      - name: Run backtest
        run: python backtest.py
      - name: Generate validated conditions
        # Must run right after backtest.py, same environment — reads
        # backtest_results.json (just written above) and writes
        # validated_conditions.json, the file ConvictionGate actually
        # loads. Without this step, backtest.py alone never updates
        # the live gate — it only ever wrote backtest_results.json,
        # which nothing in wheat_monitor_pro.py reads directly.
        run: python generate_validated_conditions.py
      - name: Save results
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: |
            backtest_results.json
            validated_conditions.json
      - name: Commit results to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest_results.json
          git add validated_conditions.json
          git diff --staged --quiet || git commit -m "Add backtest + validated conditions results [skip ci]"
          git push
