name: Wheat News Digest (free, keyless)
on:
  schedule:
    - cron: '0 6,12,18 * * *'   # 3x daily: 06:00, 12:00, 18:00 UTC (09:00, 15:00, 21:00 Israel)
  workflow_dispatch:

jobs:
  news_digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install packages
      # Deliberately lightweight — no TensorFlow/ML deps needed,
      # just an HTTP fetch and XML parsing.
      run: pip install requests
    - name: Run news digest
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python news_reader.py
    - name: Commit seen-headlines log
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -f news_seen_log.json || true
        git diff --staged --quiet || git commit -m "Update news seen log [skip ci]"
        git push || echo "Nothing to push"
