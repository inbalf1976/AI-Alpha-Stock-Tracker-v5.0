name: Pattern Scan (research, read-only)

on:
  workflow_dispatch:
    inputs:
      move_pct:
        description: "Rapid-move size in percent"
        required: false
        default: "2.5"
      horizon:
        description: "Hours the move may take"
        required: false
        default: "6"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy scikit-learn

      - name: Run pattern scan
        env:
          MOVE_PCT: ${{ inputs.move_pct || '2.5' }}
          HORIZON: ${{ inputs.horizon || '6' }}
        run: python pattern_scan.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-scan-report
          path: pattern_scan_report.json
          if-no-files-found: ignore
