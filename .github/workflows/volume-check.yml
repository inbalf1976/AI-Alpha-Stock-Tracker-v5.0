name: Volume Lag Diagnostic (temporary)
on:
  workflow_dispatch:   # manual trigger only — run this from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install packages
      run: pip install yfinance pandas
    - name: Run volume lag check
      run: python volume_lag_check.py
