name: Wheat Monitor v5 (research / report / score)

on:
  workflow_dispatch:
    inputs:
      command:
        description: "research = fair tests + range calibration | report = daily/weekly/monthly ranges (+Telegram) | score = score past forecasts"
        required: true
        default: "research"
        type: choice
        options: [research, report, score]
      commit_files:
        description: "Commit signal_registry.json / v5_forecast_log.json back to the repo"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: wheat-v5
  cancel-in-progress: false

jobs:
  v5:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Run wheat_v5.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python wheat_v5.py ${{ inputs.command }}

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: wheat-v5-${{ inputs.command }}
          path: |
            wheat_v5_research.json
            signal_registry.json
            v5_forecast_log.json
            wheat_v5_report.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit registry / forecast log (optional)
        if: ${{ inputs.commit_files }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add signal_registry.json v5_forecast_log.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "wheat v5 state [skip ci]"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
