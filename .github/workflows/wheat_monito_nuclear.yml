name: Wheat Monitor - HOURLY (Nuclear Option)

on:
  schedule:
    # Run EVERY HOUR - script will decide when to alert
    - cron: '0 * * * *'      # Every hour on the hour
    - cron: '15 * * * *'     # Every hour at :15
    - cron: '30 * * * *'     # Every hour at :30
    - cron: '45 * * * *'     # Every hour at :45
    
  workflow_dispatch:  # Manual trigger
  
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'wheat_monitor_state.json'
      - 'weather_cache.json'
      - 'wasde_cache.json'

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Show run info
      run: |
        echo "════════════════════════════════════════════════════════"
        echo "UTC:    $(date -u +'%Y-%m-%d %H:%M:%S')"
        echo "Israel: ~$(date -u -d '+3 hours' +'%H:%M') (approximate)"
        echo "════════════════════════════════════════════════════════"
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install yfinance pandas numpy scikit-learn requests pytz
        pip install tensorflow-cpu keras xgboost beautifulsoup4 lxml
    
    - name: Run Wheat Monitor
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        VISUAL_CROSSING_API_KEY: ${{ secrets.VISUAL_CROSSING_API_KEY }}
        USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
      run: python wheat_monitor_ultimate_v3_scheduled.py
    
    - name: Check alert status
      run: |
        TODAY=$(date -u +'%Y-%m-%d')
        LAST_ALERT=$(grep -oP '"last_alert_date":\s*"\K[^"]+' wheat_monitor_state.json 2>/dev/null || echo "unknown")
        
        if [ "$LAST_ALERT" = "$TODAY" ]; then
          echo "✅ ALERT SENT TODAY!"
        else
          echo "ℹ️  No alert today yet (last: $LAST_ALERT)"
        fi
    
    - name: Commit state
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -f wheat_monitor_state.json weather_cache.json wasde_cache.json 2>/dev/null || true
        git diff --quiet --staged || git commit -m "Update state [skip ci]"
        git push || true
        echo "  - Every hour 7-15 UTC (intraday)"
