name: Fade Robustness Check (research, read-only)

on:
  workflow_dispatch:
    inputs:
      cost_pct:
        description: "Round-trip spread in % of price (Plus500 wheat: 0.50c on ~704c = 0.071)"
        required: false
        default: "0.071"

permissions:
  contents: read

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Run robustness check
        env:
          COST_PCT: ${{ inputs.cost_pct || '0.071' }}
        run: python fade_robustness.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fade-robustness-report
          path: fade_robustness_report.json
          if-no-files-found: ignore
