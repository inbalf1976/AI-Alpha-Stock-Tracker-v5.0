name: Level Fade Backtest (research, read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Run level-fade backtest
        run: python level_fade_backtest.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: level-fade-report
          path: level_fade_report.json
          if-no-files-found: ignore
