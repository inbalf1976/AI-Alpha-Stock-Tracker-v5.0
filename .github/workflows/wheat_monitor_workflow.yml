"""
TELEGRAM DIAGNOSTIC SCRIPT
Tests your Telegram bot configuration and sends a test message
"""
 
import os
import sys
import requests
from datetime import datetime
 
def test_telegram():
    print("=" * 80)
    print("🔍 TELEGRAM DIAGNOSTIC TEST")
    print("=" * 80)
    
    # Get credentials
    bot_token = os.getenv("TELEGRAM_BOT_TOKEN")
    chat_id = os.getenv("TELEGRAM_CHAT_ID")
    
    print("\n1️⃣ CHECKING ENVIRONMENT VARIABLES:")
    print(f"   TELEGRAM_BOT_TOKEN: {'✅ SET' if bot_token else '❌ MISSING'}")
    if bot_token:
        print(f"   Token length: {len(bot_token)} chars")
        print(f"   Token format: {bot_token[:10]}...{bot_token[-10:] if len(bot_token) > 20 else ''}")
    
    print(f"   TELEGRAM_CHAT_ID: {'✅ SET' if chat_id else '❌ MISSING'}")
    if chat_id:
        print(f"   Chat ID: {chat_id}")
    
    if not bot_token or not chat_id:
        print("\n❌ FAILED: Missing credentials!")
        print("\nTo fix:")
        print("1. Go to your GitHub repo → Settings → Secrets and variables → Actions")
        print("2. Add these secrets:")
        print("   - TELEGRAM_BOT_TOKEN (from @BotFather)")
        print("   - TELEGRAM_CHAT_ID (your chat ID)")
        sys.exit(1)
    
    print("\n2️⃣ TESTING BOT TOKEN:")
    try:
        url = f"https://api.telegram.org/bot{bot_token}/getMe"
        response = requests.get(url, timeout=10)
        
        print(f"   Status code: {response.status_code}")
        
        if response.status_code == 200:
            data = response.json()
            if data.get('ok'):
                bot_info = data.get('result', {})
                print(f"   ✅ Bot token VALID")
                print(f"   Bot name: {bot_info.get('first_name')}")
                print(f"   Bot username: @{bot_info.get('username')}")
            else:
                print(f"   ❌ Bot token INVALID: {data}")
                sys.exit(1)
        else:
            print(f"   ❌ HTTP Error {response.status_code}")
            print(f"   Response: {response.text}")
            sys.exit(1)
    except Exception as e:
        print(f"   ❌ Error: {e}")
        sys.exit(1)
    
    print("\n3️⃣ TESTING CHAT ACCESS:")
    try:
        url = f"https://api.telegram.org/bot{bot_token}/getChat"
        params = {"chat_id": chat_id}
        response = requests.get(url, params=params, timeout=10)
        
        print(f"   Status code: {response.status_code}")
        
        if response.status_code == 200:
            data = response.json()
            if data.get('ok'):
                chat_info = data.get('result', {})
                print(f"   ✅ Chat ID VALID")
                print(f"   Chat type: {chat_info.get('type')}")
                if chat_info.get('title'):
                    print(f"   Chat title: {chat_info.get('title')}")
                if chat_info.get('username'):
                    print(f"   Chat username: @{chat_info.get('username')}")
            else:
                print(f"   ❌ Chat ID INVALID: {data}")
                print("\n   Common issues:")
                print("   - Bot hasn't been added to the chat")
                print("   - Chat ID is wrong (should start with - for groups)")
                print("   - Bot was removed from the chat")
                sys.exit(1)
        else:
            print(f"   ❌ HTTP Error {response.status_code}")
            print(f"   Response: {response.text}")
            sys.exit(1)
    except Exception as e:
        print(f"   ❌ Error: {e}")
        sys.exit(1)
    
    print("\n4️⃣ SENDING TEST MESSAGE:")
    try:
        test_message = f"""
🧪 *TELEGRAM TEST MESSAGE*
 
✅ Bot is working correctly!
🕐 Time: {datetime.now().strftime('%Y-%m-%d %H:%M:%S UTC')}
🤖 Environment: GitHub Actions
 
This is a test from your wheat monitor system.
If you see this, Telegram alerts are configured correctly! 🎉
"""
        
        url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
        data = {
            "chat_id": chat_id,
            "text": test_message,
            "parse_mode": "Markdown"
        }
        
        print(f"   Sending to: {chat_id}")
        print(f"   Message length: {len(test_message)} chars")
        
        response = requests.post(url, data=data, timeout=10)
        
        print(f"   Status code: {response.status_code}")
        print(f"   Response: {response.text[:200]}")
        
        if response.status_code == 200:
            data = response.json()
            if data.get('ok'):
                print(f"   ✅ TEST MESSAGE SENT!")
                print(f"   Message ID: {data.get('result', {}).get('message_id')}")
            else:
                print(f"   ❌ Send failed: {data}")
                sys.exit(1)
        else:
            print(f"   ❌ HTTP Error {response.status_code}")
            print(f"   Response: {response.text}")
            sys.exit(1)
            
    except Exception as e:
        print(f"   ❌ Error: {e}")
        import traceback
        traceback.print_exc()
        sys.exit(1)
    
    print("\n" + "=" * 80)
    print("✅ ALL TESTS PASSED!")
    print("Your Telegram bot is configured correctly.")
    print("=" * 80)
 
if __name__ == "__main__":
    test_telegram()
