name: Wheat Monitor PRO - Ultimate Edition
on:
  schedule:
    - cron: '0 22 * * 0-4'  # 22:00 UTC Sun-Thu = 01:00 Israel time Mon-Fri (IDT UTC+3)
    - cron: '30 22 * * 0'   # 22:30 UTC Sunday — weekly backtest refresh, after the Sunday monitor run
    - cron: '0 0 * * 6'     # 00:00 UTC Saturday = 03:00 Israel time Saturday — accuracy report ONLY, no new alert
    - cron: '0 6 * * *'     # 06:00 UTC daily — news scan #1
    - cron: '0 12 * * *'    # 12:00 UTC daily — news scan #2
    - cron: '0 18 * * *'    # 18:00 UTC daily — news scan #3
  workflow_dispatch:         # manual trigger kept for testing
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    if: contains(fromJSON('["0 22 * * 0-4", "30 22 * * 0"]'), github.event.schedule) || github.event_name == 'workflow_dispatch'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install packages
      run: |
        pip install yfinance pandas numpy scikit-learn requests
        pip install tensorflow-cpu keras
        pip install xgboost beautifulsoup4 lxml
    - name: Determine if this is the weekly backtest run
      id: check_schedule
      run: |
        if [ "${{ github.event.schedule }}" = "30 22 * * 0" ]; then
          echo "is_backtest_run=true" >> $GITHUB_OUTPUT
        else
          echo "is_backtest_run=false" >> $GITHUB_OUTPUT
        fi
    - name: Weekly backtest refresh
      if: steps.check_schedule.outputs.is_backtest_run == 'true'
      # Runs once a week (Sunday), separate from the daily monitor
      # schedule, since a 730-day rolling window barely moves day to
      # day — running this daily would be wasted compute for near-
      # zero new information (confirmed 2026-07-09: baseline moved
      # only 0.07% across a 2-day gap).
      run: |
        python backtest.py
        python generate_validated_conditions.py
    - name: Run Professional Monitor
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python wheat_monitor_pro.py
    - name: Score past predictions
      # Closes the validation loop: checks every logged prediction old
      # enough to have a real outcome against what price actually did,
      # and marks it WIN/LOSS. Safe to run every time — it skips
      # predictions already scored and predictions too recent to score.
      run: python score_predictions.py
    - name: Commit state to repository
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -f wheat_monitor_state.json || true
        git add -f prediction_log.json || true
        git add -f weekly_range_cache.json || true
        git add -f backtest_results.json || true
        git add -f validated_conditions.json || true
        git add -f monthly_range_cache.json || true
        git add -f weekly_performance_log.json || true
        git add -f weekly_break_log.json || true
        git diff --staged --quiet || git commit -m "Update monitor state [skip ci]"
        git push || echo "Nothing to push"

  saturday_report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.schedule == '0 0 * * 6'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Send weekly accuracy report ONLY
      # Saturday 03:00 Israel — deliberately does NOT run the full
      # monitor or generate a new alert, per design: this is purely
      # a real, logged day-by-day accuracy conclusion for the week
      # that just ended (see weekly_report.py).
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python weekly_report.py

  news_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    if: contains(fromJSON('["0 6 * * *", "0 12 * * *", "0 18 * * *"]'), github.event.schedule)
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install packages
      run: pip install feedparser google-genai yfinance
    - name: Run news scan
      # Free Google News RSS (no key) + free-tier Gemini interpretation
      # (needs GEMINI_API_KEY secret — get one free at aistudio.google.com).
      # Runs 3x/day since news breaks any time, not just at 01:00 Israel.
      # NOTE: no Telegram alert sent — this feeds the forecast model
      # silently in the background, per design (2026-07-19).
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python news_scanner.py
    - name: Commit news logs
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -f news_log.json || true
        git add -f news_signal_log.json || true
        git diff --staged --quiet || git commit -m "Update news scan logs [skip ci]"
        git push || echo "Nothing to push"
