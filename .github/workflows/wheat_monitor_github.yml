name: Wheat Monitor Daily Alert

# Schedule updated: 2026-05-15 - Daily at 21:00 UTC
permissions:
  contents: write
  actions: write

on:
  schedule:
    # Run once daily at 21:00 UTC = 23:00 Israel time (Mon-Fri)
    # Updated: May 15, 2026
    - cron: '0 21 * * 1-5'
  workflow_dispatch:  # Allow manual trigger
  push:
    branches:
      - main
      - master

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Fetch all history
        
    - name: Pull latest changes
      run: |
        git pull origin main || git pull origin master || true
        
    - name: Verify code version
      run: |
        echo "=== CODE VERIFICATION ==="
        head -20 wheat_monitor_pro.py | grep -i "version\|edition" || true
        echo "========================="
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        pip install --break-system-packages yfinance pandas numpy scikit-learn tensorflow requests xgboost
        
    - name: Run wheat monitor
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        VISUAL_CROSSING_API_KEY: ${{ secrets.VISUAL_CROSSING_API_KEY }}
        USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        # ✅ ADD YAHOO FINANCE TO NETWORK ALLOWLIST
        ALLOWED_DOMAINS: >-
          *.yahoo.com,
          *.yimg.com,
          query1.finance.yahoo.com,
          query2.finance.yahoo.com,
          fc.yahoo.com,
          *.adobe.io,
          adobe.io,
          api.anthropic.com,
          archive.ubuntu.com,
          crates.io,
          files.pythonhosted.org,
          github.com,
          index.crates.io,
          npmjs.com,
          npmjs.org,
          pypi.org,
          pythonhosted.org,
          registry.npmjs.org,
          registry.yarnpkg.com,
          security.ubuntu.com,
          static.crates.io,
          www.npmjs.com,
          www.npmjs.org,
          yarnpkg.com,
          weather.visualcrossing.com,
          quickstats.nass.usda.gov
      run: |
        python wheat_monitor_pro.py
        
    - name: Commit state changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git pull origin main || git pull origin master || true
        git add wheat_monitor_state.json weather_cache.json wasde_cache.json || true
        git diff --quiet && git diff --staged --quiet || git commit -m "Update monitor state [skip ci]"
        git push || true
