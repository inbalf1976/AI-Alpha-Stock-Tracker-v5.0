name: Wheat Monitor PRO - Ultimate Edition
on:
  schedule:
    - cron: '0 22 * * 6,0,1,2,3'  # 22:00 UTC Sat-Wed = 01:00 Israel time Sun-Thu (IDT UTC+3)
    - cron: '30 22 * * 6'         # 22:30 UTC Saturday — weekly backtest refresh, after the Sunday monitor run
    - cron: '0 0 * * 6'           # 00:00 UTC Saturday = 03:00 Israel time Saturday — accuracy report ONLY, no new alert
    - cron: '0 6 * * *'           # 06:00 UTC daily — news scan #1
    - cron: '0 12 * * *'          # 12:00 UTC daily — news scan #2
    - cron: '0 18 * * *'          # 18:00 UTC daily — news scan #3
  workflow_dispatch:         # manual trigger kept for testing
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    if: contains(fromJSON('["0 22 * * 6,0,1,2,3", "30 22 * * 6"]'), github.event.schedule) || github.event_name == 'workflow_dispatch'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install packages
      run: |
        pip install yfinance pandas numpy scikit-learn requests
        pip install tensorflow-cpu keras
        pip install xgboost beautifulsoup4 lxml
    - name: Determine if this is the weekly backtest run
      id: check_schedule
      run: |
        if [ "${{ github.event.schedule }}" = "30 22 * * 6" ]; then
          echo "is_backtest_run=true" >> $GITHUB_OUTPUT
        else
          echo "is_backtest_run=false" >> $GITHUB_OUTPUT
        fi
    - name: Weekly backtest refresh
      if: steps.check_schedule.outputs.is_backtest_run == 'true'
      # Runs once a week (Saturday UTC, ahead of the Sunday-Israel
      # monitor run), separate from the daily monitor schedule, since
      # a 730-day rolling window barely moves day to day — running
      # this daily would be wasted compute for near-zero new
      # information (confirmed 2026-07-09: baseline moved only 0.07%
      # across a 2-day gap).
      run: |
        python backtest.py
        python generate_validated_conditions.py
    - name: Run Professional Monitor
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python wheat_monitor_pro.py
    - name: Score past predictions
      # Closes the validation loop: checks every logged prediction old
      # enough to have a real outcome against what price actually did,
      # and marks it WIN/LOSS. Safe to run every time — it skips
      # predictions already scored and predictions too recent to score.
      run: python score_predictions.py
    - name: Commit state to repository
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -f wheat_monitor_state.json || true
        git add -f prediction_log.json || true
        git add -f weekly_range_cache.json || true
        git add -f backtest_results.json || true
        git add -f validated_conditions.json || true
        git add -f monthly_range_cache.json || true
        git add -f weekly_performance_log.json || true
        git add -f weekly_break_log.json || true
        git diff --staged --quiet || git commit -m "Update monitor state [skip ci]"
        git push || echo "Nothing to push"

  saturday_report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.schedule == '0 0 * * 6' || github.event_name == 'workflow_dispatch'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install packages
      run: pip install requests
    - name: Send weekly accuracy report ONLY
      # Saturday 03:00 Israel — deliberately does NOT run the full
      # monitor or generate a new alert, per design: this is purely
      # a real, logged day-by-day accuracy conclusion for the week
      # that just ended (see weekly_report.py).
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python weekly_report.py

  news_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    if: contains(fromJSON('["0 6 * * *", "0 12 * * *", "0 18 * * *"]'), github.event.schedule) || github.event_name == 'workflow_dispatch'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install news scanner packages
      run: pip install feedparser google-genai yfinance beautifulsoup4
    - name: Run news scan
      # Free Google News RSS (no key) + free-tier Gemini interpretation
      # (needs GEMINI_API_KEY secret — get one free at aistudio.google.com).
      # Runs 3x/day since news breaks any time, not just at 01:00 Israel.
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python news_scanner.py
    - name: Check for large price move
      # UPDATED 2026-07-31: after every scan, compares current live
      # price against wheat_monitor_state.json's last_price (recorded
      # at the last full monitor run). If the move meets or exceeds
      # check_price_trigger.py's threshold, the steps below re-run the
      # full monitor immediately instead of waiting for the next
      # scheduled 1am cycle — see check_price_trigger.py for the full
      # rationale.
      id: price_check
      run: python check_price_trigger.py
    - name: Install monitor packages (only if price move triggered)
      if: steps.price_check.outputs.trigger == 'true'
      run: |
        pip install pandas numpy scikit-learn requests
        pip install tensorflow-cpu keras
        pip install xgboost beautifulsoup4 lxml
    - name: Re-run full monitor (price-move triggered)
      # Only fires when check_price_trigger.py detected a move at or
      # above its threshold since the last full run. FORCE_ALERT reuses
      # wheat_monitor_pro.py's existing manual-trigger hook — the model
      # decides for itself (via seasonal/gate/ensemble/break logic,
      # completely unchanged) whether this actually warrants a new
      # alert; this step only shortens how long it takes to look.
      if: steps.price_check.outputs.trigger == 'true'
      env:
        FORCE_ALERT: "true"
        PRICE_MOVE_REASON: "Price move ${{ steps.price_check.outputs.move_pct }} detected by news scanner"
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python wheat_monitor_pro.py
    - name: Commit news + state logs
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -f news_log.json || true
        git add -f wheat_monitor_state.json || true
        git add -f prediction_log.json || true
        git add -f weekly_range_cache.json || true
        git add -f weekly_performance_log.json || true
        git add -f weekly_break_log.json || true
        git diff --staged --quiet || git commit -m "Update news scan + state [skip ci]"
        git push || echo "Nothing to push"
