name: Wheat Monitor PRO - Ultimate Edition
on:
  schedule:
    - cron: '0 22 * * 6,0,1,2,3'  # 22:00 UTC Sat-Wed = 01:00 Israel time Sun-Thu (IDT UTC+3)
    - cron: '30 22 * * 6'         # 22:30 UTC Saturday — weekly backtest refresh, after the Sunday monitor run
    - cron: '0 0 * * 6'           # 00:00 UTC Saturday = 03:00 Israel time Saturday — accuracy report ONLY, no new alert
    # UPDATED 2026-08-08: news_scan cron times synchronized with the
    # model's own key moments instead of running on an independent,
    # evenly-spaced schedule. Times below are "as close as possible
    # before" each moment (assuming IDT/UTC+3, same convention as the
    # 01:00 monitor cron above — during winter/standard time (UTC+2)
    # these drift ~1h earlier in real Israel time, same accepted
    # seasonal drift as the existing monitor cron, safely absorbed by
    # should_send()'s 2-hour (01:00-02:00) alert window):
    #   22:58 UTC ≈ 01:58 IL — just before the 01:00-02:00 IL alert window
    #   08:35 UTC ≈ 11:35 IL — mid-session check
    #   13:15 UTC ≈ 16:15 IL — ahead of market open
    - cron: '58 22 * * *'         # news scan #1 — just before the monitor's alert window
    - cron: '35 8 * * *'          # news scan #2 — mid-session
    - cron: '15 13 * * *'         # news scan #3 — ahead of market open
  workflow_dispatch:         # manual trigger kept for testing
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    if: contains(fromJSON('["0 22 * * 6,0,1,2,3", "30 22 * * 6"]'), github.event.schedule) || github.event_name == 'workflow_dispatch'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install packages
      run: |
        pip install yfinance pandas numpy scikit-learn requests
        pip install tensorflow-cpu keras
        pip install xgboost beautifulsoup4 lxml
    - name: Determine if this is the weekly backtest run
      id: check_schedule
      run: |
        if [ "${{ github.event.schedule }}" = "30 22 * * 6" ]; then
          echo "is_backtest_run=true" >> $GITHUB_OUTPUT
        else
          echo "is_backtest_run=false" >> $GITHUB_OUTPUT
        fi
    - name: Weekly backtest refresh
      if: steps.check_schedule.outputs.is_backtest_run == 'true'
      run: |
        python backtest.py
        python generate_validated_conditions.py
    - name: Run Professional Monitor
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python wheat_monitor_pro.py
    - name: Score past predictions
      run: python score_predictions.py
    - name: Commit state to repository
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -f wheat_monitor_state.json || true
        git add -f prediction_log.json || true
        git add -f weekly_range_cache.json || true
        git add -f backtest_results.json || true
        git add -f validated_conditions.json || true
        git add -f monthly_range_cache.json || true
        git add -f weekly_performance_log.json || true
        git add -f weekly_break_log.json || true
        git diff --staged --quiet || git commit -m "Update monitor state [skip ci]"
        git push || echo "Nothing to push"

  saturday_report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.schedule == '0 0 * * 6' || github.event_name == 'workflow_dispatch'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install packages
      run: pip install requests
    - name: Send weekly accuracy report ONLY
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python weekly_report.py

  news_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # UPDATED 2026-08-08: matches the new synchronized cron strings above.
    if: contains(fromJSON('["58 22 * * *", "35 8 * * *", "15 13 * * *"]'), github.event.schedule) || github.event_name == 'workflow_dispatch'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install news scanner packages
      run: pip install feedparser google-genai yfinance beautifulsoup4
    - name: Run news scan
      # Now synchronized to land just before the model's own key
      # moments (see cron comments above) instead of an independent
      # evenly-spaced schedule — see news_scanner.py CHANGELOG 2026-08-08.
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python news_scanner.py
    - name: Check for large price move
      id: price_check
      run: python check_price_trigger.py
    - name: Install monitor packages (only if price move triggered)
      if: steps.price_check.outputs.trigger == 'true'
      run: |
        pip install pandas numpy scikit-learn requests
        pip install tensorflow-cpu keras
        pip install xgboost beautifulsoup4 lxml
    - name: Re-run full monitor (price-move triggered)
      if: steps.price_check.outputs.trigger == 'true'
      env:
        FORCE_ALERT: "true"
        PRICE_MOVE_REASON: "Price move ${{ steps.price_check.outputs.move_pct }} detected by news scanner"
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python wheat_monitor_pro.py
    - name: Commit news + state logs
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -f news_log.json || true
        git add -f wheat_monitor_state.json || true
        git add -f prediction_log.json || true
        git add -f weekly_range_cache.json || true
        git add -f weekly_performance_log.json || true
        git add -f weekly_break_log.json || true
        git diff --staged --quiet || git commit -m "Update news scan + state [skip ci]"
        git push || echo "Nothing to push"
