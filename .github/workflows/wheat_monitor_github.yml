name: Wheat Monitor PRO - Ultimate Edition
on:
  schedule:
    - cron: '53 23 * * 0,1,2,3,4'  # 23:53 UTC Sun-Thu = 02:53 Israel time Mon-Fri (IDT UTC+3)
    # UPDATED 2026-08-25: retimed from ~01:00 IL to ~03:00 IL after the
    # user confirmed Plus500's actual trading day starts at 03:00 IL
    # (Session 1: 03:00-15:45, then closed 15:45-16:30, then Session 2:
    # 16:30-21:20, Mon-Fri). The underlying futures daily-bar data is
    # already fresh well before 03:00 (CME Globex's own session
    # boundary is ~01:00 IL) — but the alert is only truly ACTIONABLE
    # once Plus500 itself opens, so firing right before 03:00 maximizes
    # the real usable window (both sessions, ~14h) instead of sitting
    # unactioned for 2 hours. A second scheduled alert for Session 2
    # (16:30) was considered and deliberately rejected — the daily bar
    # doesn't refresh again by then, so a second scheduled read would
    # just be re-reading the same day's data; check_price_trigger.py
    # already provides an event-driven re-check during Session 2 (or
    # anytime) if something material happens, without needing a second
    # *scheduled* slot. Still fires 7 minutes before the real 03:00
    # target (same delay-buffer convention as before) — paired with
    # should_send()'s window widening to (2,3,4) in wheat_monitor_pro.py
    # so a low-delay day still sends normally instead of being silently
    # rejected as "not scheduled hour".
    - cron: '30 22 * * 5'         # 22:30 UTC Friday = 01:30 Israel time Saturday — weekly backtest refresh, own dedicated job (see weekly_backtest below), never sends a monitor alert
    - cron: '0 0 * * 6'           # 00:00 UTC Saturday = 03:00 Israel time Saturday — accuracy report ONLY, no new alert
    # UPDATED 2026-08-25: news_scan times re-anchored to the CORRECTED
    # Plus500 session structure (see monitor cron comment above for the
    # full story). Previous scan #3 comment ("ahead of market open" at
    # 16:05/16:15 IL) was based on a wrong assumption — Plus500's real
    # Session 2 doesn't open until 16:30, so that scan was landing
    # BEFORE a close that had already happened at 15:45, not before an
    # open. Now:
    #   23:28 UTC ≈ 02:28 IL — ~25min BEFORE the monitor's ~02:53 IL
    #     target (same "scan lands before monitor consumes it" pattern
    #     as before, just retimed to the new target)
    #   08:35 UTC ≈ 11:35 IL — mid-Session-1 check (unchanged, still
    #     falls comfortably inside the real 03:00-15:45 session)
    #   13:20 UTC ≈ 16:20 IL — NOW correctly just before the REAL
    #     Session 2 bourse-open at 16:30 (previously 16:05/16:15,
    #     which was actually AFTER Session 1 already closed at 15:45)
    - cron: '28 23 * * *'         # news scan #1 — see comment block above
    - cron: '35 8 * * *'          # news scan #2 — mid-session
    - cron: '20 13 * * *'         # news scan #3 — see comment block above
  workflow_dispatch:         # manual trigger kept for testing
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    if: contains(fromJSON('["53 23 * * 0,1,2,3,4"]'), github.event.schedule) || github.event_name == 'workflow_dispatch'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install packages
      run: |
        pip install yfinance pandas numpy scikit-learn requests
        pip install tensorflow-cpu keras
        pip install xgboost beautifulsoup4 lxml
    - name: Run Professional Monitor
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python wheat_monitor_pro.py
    - name: Score past predictions
      run: python score_predictions.py
    - name: Commit state to repository
      # UPDATED 2026-08-17: the retry logic below (added 2026-08-12)
      # only works if the working directory is fully clean after the
      # commit. The explicit "git add -f <file>" list only stages
      # files we know about — if wheat_monitor_pro.py or
      # score_predictions.py ever touches a tracked file NOT on this
      # list, that file stays unstaged/dirty after commit, and
      # "git pull --rebase" then refuses to run at all ("cannot pull
      # with rebase: you have unstaged changes") — confirmed live
      # 2026-08-17, a rejected push correctly triggered a retry, but
      # the retry itself then failed for this reason. Fix: `git add -A`
      # right before committing, so everything modified this run is
      # staged and the tree is clean — the explicit adds above stay
      # (documents intent / what we expect to change) but no longer
      # need to be a complete list.
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -f wheat_monitor_state.json || true
        git add -f prediction_log.json || true
        git add -f weekly_range_cache.json || true
        git add -f backtest_results.json || true
        git add -f validated_conditions.json || true
        git add -f monthly_range_cache.json || true
        git add -f weekly_performance_log.json || true
        git add -f weekly_break_log.json || true
        git add -A
        if git diff --staged --quiet; then
          echo "Nothing to commit."
        else
          git commit -m "Update monitor state [skip ci]"
          for attempt in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            # UPDATED 2026-08-17: switched from `git pull --rebase` to
            # `git fetch` + `git merge -X ours` — confirmed live that a
            # rebase can hit a genuine merge conflict (not just a
            # dirty-tree block) when the news_scan job's concurrent
            # commit touches the SAME file (e.g. wheat_monitor_state.json)
            # with different real content. A conflict mid-rebase leaves
            # the repo in a broken state this loop can't recover from.
            # `-X ours` resolves any conflicting hunks in favor of THIS
            # job's own fresh data, which is the right call for state/log
            # files where "keep the newest run's numbers" is the sensible
            # resolution — verified in a local test to merge cleanly and
            # preserve both this run's changes and any untouched files.
            echo "Push failed (attempt $attempt) — fetching + merging (prefer local) and retrying..."
            git fetch origin main
            git merge -X ours origin/main -m "merge: resolve concurrent state update [skip ci]"
          done
          echo "::error::git push failed after 3 attempts — monitor state updates did NOT reach the repo this run."
          exit 1
        fi
    - name: Notify Telegram on job failure
      # ADDED 2026-08-17: previously the ONLY signal for a failed job
      # (e.g. the push-retry above exhausting all 3 attempts, or any
      # other step failing) was a red X in the GitHub Actions tab —
      # nothing proactive, so it's only noticed on a manual check.
      # This fires on ANY failure in this job, whatever the cause,
      # and pings Telegram immediately with a link to the failed run.
      if: failure()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        MSG=$(printf "⚠️ Wheat Monitor 'monitor' job FAILED\n%s\nCheck the log — this is not a routine skip, something actually broke." "$RUN_URL")
        curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d text="$MSG" \
          || echo "Telegram failure-notify send itself failed — check Actions tab directly."
  weekly_backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # ADDED 2026-08-23: split out of the 'monitor' job — real incident:
    # the backtest previously shared monitor's job/steps, so it also ran
    # the full wheat_monitor_pro.py and sent a real "scheduled" alert
    # every week, on what was additionally the WRONG day (the old cron
    # '30 22 * * 6' = UTC Saturday = IL Sunday, not Saturday as intended).
    # This job now only runs the backtest itself — never touches
    # wheat_monitor_pro.py, so it can never send a monitor alert — on a
    # cron that actually lands on IL Saturday (UTC Friday 22:30).
    if: github.event.schedule == '30 22 * * 5' || github.event_name == 'workflow_dispatch'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install packages
      run: |
        pip install yfinance pandas numpy scikit-learn requests
        pip install tensorflow-cpu keras
        pip install xgboost beautifulsoup4 lxml
    - name: Weekly backtest refresh
      run: |
        python backtest.py
        python generate_validated_conditions.py
    - name: Commit backtest results
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -f backtest_results.json || true
        git add -f validated_conditions.json || true
        git add -A
        if git diff --staged --quiet; then
          echo "Nothing to commit."
        else
          git commit -m "Update backtest results [skip ci]"
          for attempt in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push failed (attempt $attempt) — fetching + merging (prefer local) and retrying..."
            git fetch origin main
            git merge -X ours origin/main -m "merge: resolve concurrent state update [skip ci]"
          done
          echo "::error::git push failed after 3 attempts — backtest results did NOT reach the repo this run."
          exit 1
        fi
    - name: Notify Telegram on job failure
      if: failure()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        MSG=$(printf "⚠️ Wheat Monitor 'weekly_backtest' job FAILED\n%s\nCheck the log — this is not a routine skip, something actually broke." "$RUN_URL")
        curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d text="$MSG" \
          || echo "Telegram failure-notify send itself failed — check Actions tab directly."

  saturday_report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    if: github.event.schedule == '0 0 * * 6' || github.event_name == 'workflow_dispatch'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install packages
      run: pip install requests
    - name: Send weekly accuracy report ONLY
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python weekly_report.py
    - name: Commit report run timestamp
      # ADDED 2026-08-23: weekly_report.py now writes
      # weekly_report_state.json (see that script) so bug_detector.py
      # can verify this job actually ran on the correct day/hour — this
      # job previously had no commit step at all, so that file would
      # otherwise be created on the runner and immediately lost.
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -f weekly_report_state.json || true
        git add -A
        if git diff --staged --quiet; then
          echo "Nothing to commit."
        else
          git commit -m "Update weekly report state [skip ci]"
          for attempt in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push failed (attempt $attempt) — fetching + merging (prefer local) and retrying..."
            git fetch origin main
            git merge -X ours origin/main -m "merge: resolve concurrent state update [skip ci]"
          done
          echo "::error::git push failed after 3 attempts — weekly_report_state.json did NOT reach the repo this run."
          exit 1
        fi

  news_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # UPDATED 2026-08-26: widened from 10 to 15 minutes as a second
    # layer of protection alongside the step-reorder below — real
    # runs have been observed landing close to or over the old
    # 10-minute limit (article-fetch timeouts, Gemini calls, and
    # Windward fetch stacking up inside news_scanner.py), which
    # caused this job to hit its timeout and get cancelled mid-run.
    permissions:
      contents: write
    # UPDATED 2026-08-08: matches the new synchronized cron strings above.
    if: contains(fromJSON('["28 23 * * *", "35 8 * * *", "20 13 * * *"]'), github.event.schedule) || github.event_name == 'workflow_dispatch'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install news scanner packages
      run: pip install feedparser google-genai yfinance beautifulsoup4
    # UPDATED 2026-08-26, real incident: "Check for large price move"
    # previously ran AFTER "Run news scan" — a real run that hit the
    # job's timeout mid-way through news_scanner.py (10min limit, run
    # took 9m53s and was cancelled by GitHub Actions) meant the price
    # check NEVER RAN AT ALL that cycle, even though a large price
    # move (confirmed independently against Plus500, ~748c) had
    # already happened. The price-move check is the safety-critical,
    # fast half of this job — it should never be gated behind the
    # slower, more failure-prone news-scanning work. Now runs FIRST:
    # even if news_scanner.py itself times out or fails afterward, the
    # price-trigger check (and any resulting forced monitor re-run)
    # has already safely completed.
    - name: Check for large price move
      id: price_check
      run: python check_price_trigger.py
    - name: Install monitor packages (only if price move triggered)
      if: steps.price_check.outputs.trigger == 'true'
      run: |
        pip install pandas numpy scikit-learn requests
        pip install tensorflow-cpu keras
        pip install xgboost beautifulsoup4 lxml
    - name: Re-run full monitor (price-move triggered)
      if: steps.price_check.outputs.trigger == 'true'
      env:
        FORCE_ALERT: "true"
        PRICE_MOVE_REASON: "Price move ${{ steps.price_check.outputs.move_pct }} detected by news scanner"
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python wheat_monitor_pro.py
    - name: Run news scan
      # Now synchronized to land just before the model's own key
      # moments (see cron comments above) instead of an independent
      # evenly-spaced schedule — see news_scanner.py CHANGELOG 2026-08-08.
      # Moved to run AFTER the price check (2026-08-26) — see comment
      # above "Check for large price move" for why.
      # UPDATED 2026-08-26, real incident: this step was missing
      # TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID — news_scanner.py's
      # send_immediate_risk_alert() needs both to actually send, but
      # they were never passed here (only GEMINI_API_KEY was). Result:
      # every immediate-risk detection in this step silently logged
      # "Telegram not configured, skipping send" and never reached
      # Telegram — confirmed live, a real Hormuz-area tanker-attack
      # alert (event #36) was correctly detected and then silently
      # dropped. The event still got logged to immediate_risk_log.json
      # for tracking (that part doesn't depend on Telegram), only the
      # notification itself was lost.
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python news_scanner.py
    - name: Commit news + state logs
      # UPDATED 2026-08-12: "git push || echo Nothing to push" was
      # silently swallowing REAL push failures, not just genuine
      # no-op cases. By this point git diff --staged --quiet has
      # already confirmed there IS something committed, so a failed
      # push here means a real rejected (non-fast-forward) push —
      # almost certainly a race with the `monitor` job pushing to
      # main around the same time — not "nothing to push". This was
      # happening silently: news_log.json went stale for 56+ hours
      # while the workflow kept reporting success every run.
      # Now: pull --rebase and retry once before giving up, and fail
      # the step loudly (no more silent swallow) if it still can't push.
      # UPDATED 2026-08-17: added `git add -A` before committing — the
      # retry's `git pull --rebase` refuses to run if anything is left
      # unstaged, which can happen if a script modifies a tracked file
      # not on the explicit list below (confirmed live on the monitor
      # job's identical commit step this same day). Explicit adds stay
      # for clarity but no longer need to be an exhaustive list.
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -f news_log.json || true
        git add -f immediate_risk_log.json || true
        git add -f wheat_monitor_state.json || true
        git add -f prediction_log.json || true
        git add -f weekly_range_cache.json || true
        git add -f weekly_performance_log.json || true
        git add -f weekly_break_log.json || true
        git add -A
        if git diff --staged --quiet; then
          echo "Nothing to commit."
        else
          git commit -m "Update news scan + state [skip ci]"
          for attempt in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            # UPDATED 2026-08-17: same fix as the monitor job's commit
            # step — switched from `git pull --rebase` to `git fetch` +
            # `git merge -X ours`, since a rebase can hit a genuine
            # merge conflict (not just a dirty-tree block) if the
            # monitor job's concurrent commit touched the same file.
            # See that step's comment for the full explanation and test.
            echo "Push failed (attempt $attempt) — fetching + merging (prefer local) and retrying..."
            git fetch origin main
            git merge -X ours origin/main -m "merge: resolve concurrent state update [skip ci]"
          done
          echo "::error::git push failed after 3 attempts — news_log.json / state updates did NOT reach the repo this run."
          exit 1
        fi
    - name: Notify Telegram on job failure
      # ADDED 2026-08-17: same as the monitor job's failure-notify step
      # — see that step's comment for the full rationale.
      if: failure()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        MSG=$(printf "⚠️ Wheat Monitor 'news_scan' job FAILED\n%s\nCheck the log — this is not a routine skip, something actually broke." "$RUN_URL")
        curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d text="$MSG" \
          || echo "Telegram failure-notify send itself failed — check Actions tab directly."
