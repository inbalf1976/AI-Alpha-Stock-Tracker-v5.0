name: Wheat Monitor Enhanced
on:
  schedule:
    # Run every hour to catch emergency moves
    - cron: '0 * * * *'  # Every hour
    
    # OR run at specific times (more efficient):
    - cron: '0 20 * * *'  # 23:00 Israel DST
    - cron: '0 21 * * *'  # 23:00 Israel Standard
    - cron: '0 6,12,18 * * *'  # Emergency checks 3x/day
  
  workflow_dispatch:  # Manual trigger

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python wheat_monitor_v3_enhanced.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VISUAL_CROSSING_API_KEY: ${{ secrets.VISUAL_CROSSING_API_KEY }}
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
