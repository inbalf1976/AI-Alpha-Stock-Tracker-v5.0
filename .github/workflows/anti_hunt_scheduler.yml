name: Anti-Hunt Morning Filter V5

on:
  schedule:
    - cron: '45 8 * * 1-5'
      timezone: 'America/Chicago'
    - cron: '45 9 * * 1-5'
      timezone: 'America/Chicago'
    - cron: '15 13 * * 1-5'
      timezone: 'America/Chicago'
  workflow_dispatch:

concurrency:
  group: anti-hunt-filter
  cancel-in-progress: false

jobs:
  anti-hunt-filter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "yfinance>=0.2.40,<0.3" "pandas>=2.0,<3" "numpy>=1.24,<3" "requests>=2.31,<3" "scikit-learn>=1.3,<2"

      - name: Run anti-hunt filter
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "=============================================="
            echo "V5 MANUAL TEST RUN"
            echo "=============================================="
            python anti_hunt_filter.py --manual
          elif [ "${{ github.event.schedule }}" = "15 13 * * 1-5" ]; then
            echo "=============================================="
            echo "V5 OUTCOME RESOLUTION / LEARNING RUN"
            echo "=============================================="
            python anti_hunt_filter.py --resolve
          else
            echo "=============================================="
            echo "V5 SCHEDULED SIGNAL RUN"
            echo "=============================================="
            python anti_hunt_filter.py
          fi

      - name: Upload V5 snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anti-hunt-v5-snapshot-${{ github.run_id }}
          path: |
            setup.json
            learning_state.json
            learning_report.json
            ml_report.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Persist learning state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learning_state.json learning_report.json ml_report.json setup.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update anti-hunt V5 learning state"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode \
            "text=⚠️ Anti-hunt V5 workflow FAILED (run ${{ github.run_id }}): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
