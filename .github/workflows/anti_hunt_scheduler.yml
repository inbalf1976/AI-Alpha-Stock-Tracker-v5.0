name: Anti-Hunt Morning Filter

on:
  schedule:
    # 14:45 UTC is exactly 8:45 AM Chicago Time (CST) Monday through Friday
    - cron: '45 14 * * 1-5'
  workflow_dispatch: # Allows you to manually trigger it via GitHub UI to test right now

jobs:
  run-filter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Necessary Libraries
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Execute Anti-Hunt Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python anti_hunt_filter.py
