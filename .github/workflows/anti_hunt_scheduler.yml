```yaml
name: Anti-Hunt Morning Filter

on:
  schedule:
    # 13:45 UTC == 8:45 AM CDT (summer)
    # 14:45 UTC == 8:45 AM CST (winter)
    #
    # Both triggers are intentional.
    # The Python script uses America/Chicago time to determine
    # whether the scheduled run is inside the permitted window.
    - cron: '45 13 * * 1-5'
    - cron: '45 14 * * 1-5'

  # Enables the "Run workflow" button in GitHub Actions.
  workflow_dispatch:


# Prevent overlapping runs.
concurrency:
  group: anti-hunt-filter
  cancel-in-progress: false


jobs:
  anti-hunt-filter:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    permissions:
      contents: read

    steps:

      # ---------------------------------------------------------------
      # Checkout repository
      # ---------------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4


      # ---------------------------------------------------------------
      # Python
      # ---------------------------------------------------------------

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip


      # ---------------------------------------------------------------
      # Dependencies
      # ---------------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "yfinance>=0.2.40,<0.3" "pandas>=2.0,<3" "requests>=2.31,<3"


      # ---------------------------------------------------------------
      # Run anti-hunt filter
      # ---------------------------------------------------------------
      #
      # Automatic scheduled execution:
      #
      #     python anti_hunt_filter.py
      #
      # Manual GitHub Actions execution:
      #
      #     python anti_hunt_filter.py --manual
      #
      # This means the normal automated job keeps its safety guards,
      # while the Run workflow button explicitly requests test mode.
      # ---------------------------------------------------------------

      - name: Run anti-hunt filter
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}

        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            echo "=============================================="
            echo "MANUAL WORKFLOW RUN"
            echo "Running anti_hunt_filter.py --manual"
            echo "=============================================="

            python anti_hunt_filter.py --manual

          else

            echo "=============================================="
            echo "SCHEDULED WORKFLOW RUN"
            echo "Running normal safety checks"
            echo "=============================================="

            python anti_hunt_filter.py

          fi


      # ---------------------------------------------------------------
      # Upload setup snapshot
      # ---------------------------------------------------------------

      - name: Upload setup snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-snapshot-${{ github.run_id }}
          path: setup.json
          retention-days: 30
          if-no-files-found: ignore


      # ---------------------------------------------------------------
      # Telegram failure notification
      # ---------------------------------------------------------------

      - name: Notify on failure
        if: failure()

        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode \
            "text=⚠️ Anti-hunt workflow FAILED (run ${{ github.run_id }}): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
```
