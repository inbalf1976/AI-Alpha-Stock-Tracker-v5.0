name: Setup Rescore (her rules, read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Re-score the weekly setups on her rules
        run: python setup_rescore.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-rescore-report
          path: setup_rescore_report.json
          if-no-files-found: ignore
