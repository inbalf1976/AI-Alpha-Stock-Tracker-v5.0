name: Bug Detector

on:
  schedule:
    # Daily at 06:00 UTC. Silent on clean days — only alerts immediately
    # if an issue is found. Sends a full report every Sunday regardless.
    - cron: '0 6 * * *'
  workflow_dispatch: {}   # manual run button in the Actions tab

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run bug detector
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bug_detector.py
