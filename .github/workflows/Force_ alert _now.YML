name: FORCE ALERT NOW

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  force-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install yfinance pandas numpy scikit-learn requests pytz
        pip install tensorflow-cpu keras xgboost beautifulsoup4 lxml
    
    - name: Force Alert (Bypass Time Check)
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        VISUAL_CROSSING_API_KEY: ${{ secrets.VISUAL_CROSSING_API_KEY }}
        USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        FORCE_ALERT: 'true'
      run: |
        echo "🚨 FORCING ALERT - Bypassing time check"
        echo "UTC Time: $(date -u +'%Y-%m-%d %H:%M:%S')"
        python wheat_monitor_ultimate_v3_scheduled.py
    
    - name: Commit state
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -f wheat_monitor_state.json || true
        git add -f weather_cache.json || true
        git add -f wasde_cache.json || true
        if ! git diff --quiet --staged 2>/dev/null; then
          git commit -m "Update state after forced alert [skip ci]" || true
          git push || true
        fi
    
    - name: Summary
      run: |
        echo "=================================="
        echo "✅ Force alert complete!"
        echo "=================================="
        echo ""
        echo "Check your Telegram for the alert."
        echo ""
        echo "If you didn't receive it:"
        echo "1. Check the logs above for errors"
        echo "2. Verify TELEGRAM_BOT_TOKEN secret is set"
        echo "3. Verify TELEGRAM_CHAT_ID secret is set"
        echo "4. Make sure you sent /start to your bot"
