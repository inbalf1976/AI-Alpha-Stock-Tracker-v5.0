name: Rescore Daily Direction (one-off, read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Re-score daily direction on the new same-day basis (writes a COPY only)
        run: python rescore_daily_direction.py

      - name: Upload corrected copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prediction-log-rescored-direction
          path: prediction_log.rescored_direction.json
          if-no-files-found: ignore
