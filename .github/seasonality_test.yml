name: Seasonality Test (research, read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Run seasonality test
        run: python seasonality_test.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seasonality-report
          path: seasonality_report.json
          if-no-files-found: ignore
